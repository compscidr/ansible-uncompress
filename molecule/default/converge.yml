---
- name: Converge
  hosts: all
  become: true
  tasks:
    - name: Test uncompress with .gz file (no copy)
      compscidr.uncompress.uncompress:
        copy: false
        src: https://github.com/cheat/cheat/releases/download/4.3.1/cheat-linux-amd64.gz
        dest: /tmp/cheat
        mode: '755'
      register: result_cheat

    - name: Create a test .gz file
      ansible.builtin.shell: |
        echo "test content for gz" > /tmp/test.txt
        gzip -f /tmp/test.txt
      args:
        creates: /tmp/test.txt.gz

    - name: Test uncompress with local .gz file (with copy)
      compscidr.uncompress.uncompress:
        copy: true
        src: /tmp/test.txt.gz
        dest: /tmp/test-uncompressed.txt
        mode: '644'
      register: result_gz

    - name: Create a test .bz2 file
      ansible.builtin.shell: |
        echo "test content for bz2" > /tmp/test2.txt
        bzip2 -f /tmp/test2.txt
      args:
        creates: /tmp/test2.txt.bz2

    - name: Test uncompress with .bz2 file
      compscidr.uncompress.uncompress:
        copy: true
        src: /tmp/test2.txt.bz2
        dest: /tmp/test2-uncompressed.txt
        mode: '644'
      register: result_bz2

    - name: Create directory for testing directory dest
      ansible.builtin.file:
        path: /tmp/uncompress-test-dir
        state: directory
        mode: '755'

    - name: Create a test .gz file for directory dest
      ansible.builtin.shell: |
        echo "test content for gz directory" > /tmp/test3.txt
        gzip -f /tmp/test3.txt
      args:
        creates: /tmp/test3.txt.gz

    - name: Test uncompress with .gz file to directory
      compscidr.uncompress.uncompress:
        copy: true
        src: /tmp/test3.txt.gz
        dest: /tmp/uncompress-test-dir/
        mode: '644'
      register: result_gz_dir

    - name: Create a test .bz2 file for directory dest
      ansible.builtin.shell: |
        echo "test content for bz2 directory" > /tmp/test4.txt
        bzip2 -f /tmp/test4.txt
      args:
        creates: /tmp/test4.txt.bz2

    - name: Test uncompress with .bz2 file to directory
      compscidr.uncompress.uncompress:
        copy: true
        src: /tmp/test4.txt.bz2
        dest: /tmp/uncompress-test-dir/
        mode: '644'
      register: result_bz2_dir

    - name: Create a test .tar.gz file for directory dest
      ansible.builtin.shell: |
        echo "test content for tar.gz" > /tmp/test5.txt
        tar -czf /tmp/test5.tar.gz -C /tmp test5.txt
      args:
        creates: /tmp/test5.tar.gz

    - name: Test uncompress with .tar.gz file to directory (should result in .tar)
      compscidr.uncompress.uncompress:
        copy: true
        src: /tmp/test5.tar.gz
        dest: /tmp/uncompress-test-dir/
        mode: '644'
      register: result_tar_gz_dir

    - name: Create a test .xz file for .txz extension test
      ansible.builtin.shell: |
        echo "test content for txz" > /tmp/test6.txt
        tar -cf /tmp/test6.tar test6.txt
        xz -f /tmp/test6.tar
        mv /tmp/test6.tar.xz /tmp/test6.txz
      args:
        creates: /tmp/test6.txz
        chdir: /tmp

    - name: Test uncompress with .txz file to directory (should result in .tar)
      compscidr.uncompress.uncompress:
        copy: true
        src: /tmp/test6.txz
        dest: /tmp/uncompress-test-dir/
        mode: '644'
      register: result_txz_dir

    - name: Test uncompress with URL containing query parameters
      compscidr.uncompress.uncompress:
        copy: false
        src: https://github.com/cheat/cheat/releases/download/4.3.1/cheat-linux-amd64.gz?test=1&dummy=param
        dest: /tmp/uncompress-test-dir/
        mode: '755'
      register: result_url_query
      # GitHub ignores query parameters, so this should work and result in /tmp/uncompress-test-dir/cheat-linux-amd64

    - name: Create a compressed file with no compression extension (for overwrite test)
      ansible.builtin.shell: |
        echo "test content for overwrite check" > /tmp/overwrite-test.txt
        gzip -f /tmp/overwrite-test.txt
        mv /tmp/overwrite-test.txt.gz /tmp/overwrite-test
      args:
        creates: /tmp/overwrite-test

    - name: Test that uncompressing a file with no extension into same directory fails
      compscidr.uncompress.uncompress:
        copy: false
        src: /tmp/overwrite-test
        dest: /tmp/
        mode: '644'
      register: result_overwrite
      ignore_errors: true

    - name: Verify overwrite protection triggered
      ansible.builtin.assert:
        that:
          - result_overwrite is failed
          - "'resolve to the same file' in result_overwrite.msg"
        fail_msg: "Overwrite protection did not trigger when src and dest resolve to the same file"
        success_msg: "Overwrite protection correctly prevented source file from being overwritten"

    # Regression test for https://github.com/compscidr/ansible-uncompress/issues/28
    - name: Create an .xz file to uncompress into its own directory
      ansible.builtin.shell: |
        rm -rf /tmp/xz-same-dir
        mkdir -p /tmp/xz-same-dir
        echo foo > /tmp/xz-same-dir/foo
        echo bar > /tmp/xz-same-dir/bar
        xz /tmp/xz-same-dir/foo /tmp/xz-same-dir/bar
      changed_when: true
      tags: molecule-idempotence-notest

    - name: Uncompress .xz into the same directory (first run)
      compscidr.uncompress.uncompress:
        copy: false
        src: /tmp/xz-same-dir/foo.xz
        dest: /tmp/xz-same-dir/
      register: xz_first
      tags: molecule-idempotence-notest

    - name: Uncompress .xz into the same directory again (nothing changed)
      compscidr.uncompress.uncompress:
        copy: false
        src: /tmp/xz-same-dir/foo.xz
        dest: /tmp/xz-same-dir/
      register: xz_second
      tags: molecule-idempotence-notest

    - name: Replace the source with different content of the same size
      ansible.builtin.command: mv /tmp/xz-same-dir/bar.xz /tmp/xz-same-dir/foo.xz
      changed_when: true
      tags: molecule-idempotence-notest

    - name: Uncompress the replaced .xz into the same directory
      compscidr.uncompress.uncompress:
        copy: false
        src: /tmp/xz-same-dir/foo.xz
        dest: /tmp/xz-same-dir/
      register: xz_third
      tags: molecule-idempotence-notest

    - name: Read the uncompressed file
      ansible.builtin.slurp:
        src: /tmp/xz-same-dir/foo
      register: xz_content
      tags: molecule-idempotence-notest

    - name: Verify xz idempotency and content updates
      ansible.builtin.assert:
        that:
          - xz_first is changed
          - xz_second is not changed
          - xz_third is changed
          - xz_content.content | b64decode | trim == 'bar'
        fail_msg: >-
          xz same-directory uncompress misbehaved:
          first={{ xz_first.changed }} second={{ xz_second.changed }}
          third={{ xz_third.changed }} content={{ xz_content.content | b64decode | trim }}
        success_msg: "xz same-directory uncompress is idempotent and updates content"
      tags: molecule-idempotence-notest

    - name: Create a legacy .lzma file
      ansible.builtin.shell: |
        echo "test content for lzma" > /tmp/test7.txt
        xz --format=lzma -f /tmp/test7.txt
      args:
        creates: /tmp/test7.txt.lzma

    - name: Test uncompress with legacy .lzma file to directory
      compscidr.uncompress.uncompress:
        copy: true
        src: /tmp/test7.txt.lzma
        dest: /tmp/uncompress-test-dir/
        mode: '644'
      register: result_lzma_dir

    - name: Read the uncompressed .lzma output
      ansible.builtin.slurp:
        src: /tmp/uncompress-test-dir/test7.txt
      register: lzma_content

    - name: Verify legacy .lzma was uncompressed
      ansible.builtin.assert:
        that:
          - lzma_content.content | b64decode | trim == 'test content for lzma'
        fail_msg: "legacy .lzma file was not uncompressed correctly"
        success_msg: "legacy .lzma file uncompressed correctly"

    # Regression test for https://github.com/compscidr/ansible-uncompress/issues/29
    - name: Look for leftover module temp directories
      ansible.builtin.find:
        paths:
          - /tmp
          - /root/.ansible/tmp
        patterns: 'ansible-moduletmp-*'
        file_type: directory
      register: leftover_tmp

    - name: Verify temp files were cleaned up
      ansible.builtin.assert:
        that:
          - leftover_tmp.matched == 0
        fail_msg: "uncompress left temp director(ies) behind: {{ leftover_tmp.files | map(attribute='path') | list }}"
        success_msg: "No module temp directories left behind"
